name: Finalize screenshot goldens

on:
  push:
    branches: [fix/geckoview-interaction-regressions]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/geckoview-interaction-regressions
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Record screenshot references
        run: ./gradlew :app:recordRoborazziDebug --stacktrace
      - name: Commit goldens and permanent verification workflow
        shell: bash
        run: |
          set -euo pipefail
          snapshot_tmp="$(mktemp -d)"
          cp app/src/test/snapshots/*.png "$snapshot_tmp/"

          git fetch origin fix/geckoview-interaction-regressions
          git reset --hard origin/fix/geckoview-interaction-regressions
          mkdir -p app/src/test/snapshots
          cp "$snapshot_tmp"/*.png app/src/test/snapshots/

          python - <<'PY'
          from pathlib import Path

          workflow = r'''name: Android

          # Baseline/Startup Profile regeneration is intentionally kept out of normal PR CI. This workflow
          # validates committed visual references, the packaged profile, and production packaging.
          on:
            push:
              branches: [master]
            pull_request:

          permissions:
            contents: read

          concurrency:
            group: android-__D__{{ github.workflow }}-__D__{{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: android-actions/setup-android@v4
                  with:
                    packages: platform-tools
                    log-accepted-android-sdk-licenses: false
                - name: Install Android SDK
                  run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
                - uses: gradle/actions/setup-gradle@v6
                - name: Unit tests and screenshot verification
                  run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug --stacktrace
                - name: Upload screenshot differences
                  if: failure()
                  uses: actions/upload-artifact@v4
                  with:
                    name: screenshot-differences
                    path: app/build/outputs/roborazzi
                    if-no-files-found: ignore
                    retention-days: 7
                - name: Lint
                  run: ./gradlew :app:lintDebug --stacktrace
                - name: Debug APK
                  run: ./gradlew :app:assembleDebug --stacktrace
                - name: Release APK
                  run: ./gradlew :app:assembleRelease --stacktrace
                - name: Verify packaged baseline profile
                  run: |
                    test -s app/src/main/baselineProfiles/baseline-prof.txt
                    test -s app/src/main/baselineProfiles/startup-prof.txt
                    apk="__D__(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
                    test -n "__D__apk"
                    unzip -l "__D__apk" | grep -q 'assets/dexopt/baseline.prof'
                    unzip -l "__D__apk" | grep -q 'assets/dexopt/baseline.profm'
                    profile_bytes="__D__(unzip -p "__D__apk" assets/dexopt/baseline.prof | wc -c)"
                    metadata_bytes="__D__(unzip -p "__D__apk" assets/dexopt/baseline.profm | wc -c)"
                    test "__D__profile_bytes" -gt 0
                    test "__D__metadata_bytes" -gt 0
                    test "__D__profile_bytes" -lt 1572864
                    echo "Packaged baseline.prof: __D__profile_bytes bytes"
                    echo "Packaged baseline.profm: __D__metadata_bytes bytes"
                - name: Performance benchmark APK
                  run: ./gradlew :benchmark:assembleBenchmark -PminibrowserAbi=x86_64 --stacktrace
                - name: Profile generator APK
                  run: ./gradlew :benchmark:assembleProfile -PminibrowserAbi=x86_64 --stacktrace

            instrumentation:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: android-actions/setup-android@v4
                  with:
                    packages: platform-tools
                    log-accepted-android-sdk-licenses: false
                - name: Install compile SDK
                  run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
                - uses: gradle/actions/setup-gradle@v6
                - name: Enable KVM
                  run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                      | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    sudo udevadm trigger --name-match=kvm
                - name: Instrumentation tests
                  uses: reactivecircus/android-emulator-runner@v2
                  with:
                    api-level: 36
                    target: google_apis
                    arch: x86_64
                    profile: pixel_5
                    disable-animations: true
                    emulator-options: >-
                      -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
                      -camera-back none -camera-front none -no-snapshot -no-metrics
                    script: ./gradlew :app:connectedDebugAndroidTest -PminibrowserAbi=x86_64 --stacktrace
          '''
          lines = workflow.splitlines()
          non_empty = [line for line in lines if line.strip()]
          indent = min(len(line) - len(line.lstrip()) for line in non_empty)
          workflow = '\n'.join(line[indent:] if line.strip() else '' for line in lines).lstrip()
          workflow = workflow.replace('__D__', chr(36))
          Path('.github/workflows/android.yml').write_text(workflow, encoding='utf-8')
          PY

          rm -f .github/workflows/finalize-screenshot-goldens.yml
          git add -A app/src/test/snapshots .github/workflows/android.yml .github/workflows/finalize-screenshot-goldens.yml

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Commit UI screenshot references"
          git push origin HEAD:fix/geckoview-interaction-regressions
