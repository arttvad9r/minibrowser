name: Inspect Glean Resolution

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Resolve Glean graph
        run: |
          ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency org.mozilla.telemetry:glean-native --info
          ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency org.mozilla.geckoview:geckoview-omni --info
      - name: Print published GeckoView and Glean metadata
        run: |
          echo '=== GeckoView Gradle module metadata ==='
          module=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.mozilla.geckoview/geckoview-omni/154.0.20260824154132" -type f -name '*.module' | head -n 1)
          echo "$module"
          if [ -n "$module" ]; then
            grep -n -C 6 -E 'capabilit|glean-native|debugVariantDebugRuntimePublication|releaseVariantReleaseRuntimePublication' "$module" || true
          fi
          echo '=== Glean POM native dependency ==='
          pom=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.mozilla.telemetry/glean/68.0.1" -type f -name '*.pom' | head -n 1)
          echo "$pom"
          if [ -n "$pom" ]; then
            grep -n -C 6 'glean-native' "$pom" || true
          fi
