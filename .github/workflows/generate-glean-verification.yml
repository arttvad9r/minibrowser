name: Generate Glean Verification Metadata

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Inspect Glean native resolution
        run: |
          ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency org.mozilla.telemetry:glean-native --info
          ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency org.mozilla.geckoview:geckoview-omni --info
      - name: Resolve Glean graph and verify release R8
        id: resolve
        continue-on-error: true
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:assembleDebugAndroidTest
          :app:assembleRelease
          :app:bundleRelease
          --write-verification-metadata sha256
          --stacktrace
      - name: Commit generated metadata to PR branch
        if: always()
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "No verification metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "build: add Glean verification metadata"
          git push
      - name: Preserve Gradle failure status
        if: steps.resolve.outcome == 'failure'
        run: exit 1
