name: Apply runtime cleanup

on:
  pull_request:

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Apply measured-safe runtime cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/artt/minibrowser/MainActivity.kt')
          text = main.read_text()
          old = '''            var bookmarks by remember { mutableStateOf(emptyList<Bookmark>()) }
                      var bmReload by remember { mutableIntStateOf(0) }
                      LaunchedEffect(bmReload) { bookmarks = bookmarksRepo.all() }
          '''
          new = '''            var bookmarks by remember { mutableStateOf(emptyList<Bookmark>()) }
                      var bmReload by remember { mutableIntStateOf(0) }
                      LaunchedEffect(screen, currentTab?.url, bmReload) {
                          val needsBookmarks = screen == BrowserScreen.Bookmarks ||
                              (screen == BrowserScreen.Browser &&
                                  (currentTab?.url.isNullOrBlank() || currentTab?.url == "about:blank"))
                          if (needsBookmarks) bookmarks = bookmarksRepo.all()
                      }
          '''
          if old not in text:
              raise SystemExit('MainActivity bookmark-load pattern not found')
          main.write_text(text.replace(old, new, 1))

          tabs = Path('app/src/main/java/com/artt/minibrowser/engine/TabManager.kt')
          text = tabs.read_text()
          old = '''                tab.latestSessionState = state
                          tab.latestSessionStateUrl = currentSessionStateUrl(state)
                          if (!tab.isPrivate) requestPersist(immediate = false)
          '''
          new = '''                val stateUrl = currentSessionStateUrl(state)
                          tab.latestSessionState = state
                          tab.latestSessionStateUrl = stateUrl
                          // Once Gecko has produced a fresh restorable state for this URL, the serialized
                          // startup backup is redundant. Release it instead of retaining two copies of the
                          // same session history in memory for every restored tab the user has reopened.
                          if (stateUrl != null && stateUrl == tab.url) {
                              tab.persistedSessionState = null
                              tab.persistedSessionStateUrl = null
                          }
                          if (!tab.isPrivate) requestPersist(immediate = false)
          '''
          if old not in text:
              raise SystemExit('TabManager session-state pattern not found')
          tabs.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/apply-runtime-cleanup.yml
          git add app/src/main/java/com/artt/minibrowser/MainActivity.kt app/src/main/java/com/artt/minibrowser/engine/TabManager.kt .github/workflows/apply-runtime-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Reduce restored-tab and bookmark startup work"
          git push origin HEAD:${{ github.head_ref }}
