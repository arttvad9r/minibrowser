name: Room Schema

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: room-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-room-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate Room schema
        run: ./gradlew :app:kspDebugKotlin --stacktrace
      - name: Verify Room schema is committed
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- app/schemas)"
          if [[ -n "$status" ]]; then
            echo "$status"
            echo "Generated Room schema differs from committed schema:"
            find app/schemas -type f -name '*.json' -print -exec cat {} \;
            exit 1
          fi
          test -s app/schemas/com.artt.minibrowser.data.AppDb/3.json
