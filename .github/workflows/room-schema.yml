name: Room Schema

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: room-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-room-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Generate Room schema
        run: ./gradlew :app:kspDebugKotlin --stacktrace
      - name: Verify Room schema is committed
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- app/schemas)"
          if [[ -n "$status" ]]; then
            echo "$status"
            echo "Generated Room schema differs from committed schema:"
            find app/schemas -type f -name '*.json' -print -exec cat {} \;
            exit 1
          fi
          test -s app/schemas/com.artt.minibrowser.data.AppDb/3.json
