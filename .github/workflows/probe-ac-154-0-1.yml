name: Generate AC 154.0.1 Verification Metadata

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Resolve aligned Gecko engine graph
        id: resolve
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --write-verification-metadata sha256 :app:dependencies --configuration debugRuntimeClasspath --stacktrace
          ./gradlew :app:dependencyInsight --dependency org.mozilla.geckoview --configuration debugRuntimeClasspath --stacktrace | tee geckoview-dependency-insight.txt
          ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest -PminibrowserAbi=x86_64 --stacktrace
      - name: Print resolved GeckoView graph
        if: always()
        run: cat geckoview-dependency-insight.txt || true
      - name: Commit generated metadata to PR branch
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test -s gradle/verification-metadata.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Verification metadata is already current"
            exit 0
          fi
          git commit -m "build: add AC 154.0.1 verification metadata"
          git push origin "HEAD:${HEAD_REF}"
      - name: Preserve Gradle failure status
        if: steps.resolve.outcome == 'failure'
        run: exit 1
