name: Validate find fullscreen patch

on:
  push:
    branches: [tmp-ac-find-fullscreen-routing]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Patch BrowserRoute
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/artt/minibrowser/BrowserRoute.kt')
          text = path.read_text()

          replacements = [
              (
                  'import com.artt.minibrowser.engine.buildTranslateUri\nimport com.artt.minibrowser.engine.effectiveUiPageLoadError\n',
                  'import com.artt.minibrowser.engine.buildTranslateUri\nimport com.artt.minibrowser.engine.clearBrowserFindMatches\nimport com.artt.minibrowser.engine.effectiveUiPageLoadError\n',
              ),
              (
                  'import com.artt.minibrowser.engine.effectiveUiSecurityState\nimport com.artt.minibrowser.engine.goBrowserBack\n',
                  'import com.artt.minibrowser.engine.effectiveUiSecurityState\nimport com.artt.minibrowser.engine.exitBrowserFullscreen\nimport com.artt.minibrowser.engine.goBrowserBack\n',
              ),
              (
                  '    val currentUiCompatibility = currentId?.toString()?.let(uiCompatibilitySnapshots::get)\n    val currentSession = currentTab?.session\n    val currentUrl = currentStoreContent?.url ?: currentTab?.url.orEmpty()\n',
                  '    val currentUiCompatibility = currentId?.toString()?.let(uiCompatibilitySnapshots::get)\n    val currentUrl = currentStoreContent?.url ?: currentTab?.url.orEmpty()\n',
              ),
              (
                  '        onExitFullscreen = { currentSession?.exitFullScreen() },\n        onCloseFind = {\n            currentSession?.finder?.clear()\n            browserViewModel.showFind(false)\n        },\n',
                  '        onExitFullscreen = {\n            currentTab?.let { tab -> exitBrowserFullscreen(tab, browserStore) }\n        },\n        onCloseFind = {\n            currentTab?.let { tab -> clearBrowserFindMatches(tab, browserStore) }\n            browserViewModel.showFind(false)\n        },\n',
              ),
              (
                  '                                FindInPageRoute(currentTab.session, pageActions.onCloseFind)\n',
                  '                                FindInPageRoute(currentTab, browserStore, pageActions.onCloseFind)\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0 and new in text:
                  continue
              if count != 1:
                  raise SystemExit(f'expected one exact replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Unit tests and screenshots
        run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/artt/minibrowser/BrowserRoute.kt
          if git diff --cached --quiet; then
            echo "BrowserRoute already patched"
            exit 0
          fi
          git commit -m "tmp: wire ownership-aware find and fullscreen routes"
          git push origin HEAD:tmp-ac-find-fullscreen-routing
