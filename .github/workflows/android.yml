name: Android

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
