name: Android

# Baseline/Startup Profile regeneration is intentionally kept out of normal PR CI. This workflow
# validates the committed profile and production packaging without repeating the costly capture.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify packaged baseline profile
        run: |
          test -s app/src/main/baselineProfiles/baseline-prof.txt
          test -s app/src/main/baselineProfiles/startup-prof.txt
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -q 'assets/dexopt/baseline.prof'
          unzip -l "$apk" | grep -q 'assets/dexopt/baseline.profm'
          profile_bytes="$(unzip -p "$apk" assets/dexopt/baseline.prof | wc -c)"
          metadata_bytes="$(unzip -p "$apk" assets/dexopt/baseline.profm | wc -c)"
          test "$profile_bytes" -gt 0
          test "$metadata_bytes" -gt 0
          test "$profile_bytes" -lt 1572864
          echo "Packaged baseline.prof: $profile_bytes bytes"
          echo "Packaged baseline.profm: $metadata_bytes bytes"
      - name: Performance benchmark APK
        run: ./gradlew :benchmark:assembleBenchmark -PminibrowserAbi=x86_64 --stacktrace
      - name: Profile generator APK
        run: ./gradlew :benchmark:assembleProfile -PminibrowserAbi=x86_64 --stacktrace

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot -no-metrics
          script: ./gradlew :app:connectedDebugAndroidTest -PminibrowserAbi=x86_64 --stacktrace
