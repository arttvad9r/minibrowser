name: Android

# Baseline/Startup Profile regeneration is intentionally kept out of normal PR CI. This workflow
# validates committed visual references, production packaging, and native compatibility.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and screenshot verification
        run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug --stacktrace
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-differences
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 7
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Verify 16 KB native alignment
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          bundle="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -s "$bundle"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"

          native_tmp="$(mktemp -d)"
          trap 'rm -rf "$native_tmp"' EXIT
          unzip -q "$apk" 'lib/*.so' -d "$native_tmp"
          test -d "$native_tmp/lib/arm64-v8a"
          mapfile -t shared_objects < <(find "$native_tmp/lib/arm64-v8a" -type f -name '*.so' -print)
          test "${#shared_objects[@]}" -gt 0

          for so in "${shared_objects[@]}"; do
            relative="${so#"$native_tmp/"}"
            found_load=0
            while read -r alignment; do
              found_load=1
              if (( alignment < 0x4000 )); then
                echo "::error file=$relative::ELF LOAD alignment $alignment is below 16 KB"
                exit 1
              fi
            done < <(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }')
            if (( found_load == 0 )); then
              echo "::error file=$relative::No ELF LOAD segments found"
              exit 1
            fi
          done
      - name: Verify packaged baseline profile
        run: |
          test -s app/src/main/baselineProfiles/baseline-prof.txt
          test -s app/src/main/baselineProfiles/startup-prof.txt
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -q 'assets/dexopt/baseline.prof'
          unzip -l "$apk" | grep -q 'assets/dexopt/baseline.profm'
          profile_bytes="$(unzip -p "$apk" assets/dexopt/baseline.prof | wc -c)"
          metadata_bytes="$(unzip -p "$apk" assets/dexopt/baseline.profm | wc -c)"
          test "$profile_bytes" -gt 0
          test "$metadata_bytes" -gt 0
          test "$profile_bytes" -lt 1572864
          echo "Packaged baseline.prof: $profile_bytes bytes"
          echo "Packaged baseline.profm: $metadata_bytes bytes"
      - name: Performance benchmark APK
        run: ./gradlew :benchmark:assembleBenchmark -PminibrowserAbi=x86_64 --stacktrace
      - name: Profile generator APK
        run: ./gradlew :benchmark:assembleProfile -PminibrowserAbi=x86_64 --stacktrace

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot -no-metrics
          script: ./gradlew :app:connectedDebugAndroidTest -PminibrowserAbi=x86_64 --stacktrace

  page-size-16k:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Startup smoke on 16 KB pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot -no-metrics
          script: |
            adb shell getconf PAGE_SIZE
            adb shell getconf PAGE_SIZE | tr -d '\r' | grep -qx '16384'
            ./gradlew :app:connectedDebugAndroidTest \
              -PminibrowserAbi=x86_64 \
              -Pandroid.testInstrumentationRunnerArguments.class=com.artt.minibrowser.MainActivityStartupTest \
              --stacktrace
