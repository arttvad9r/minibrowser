name: Android

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Performance benchmark APK
        run: ./gradlew :benchmark:assembleBenchmark -PminibrowserAbi=x86_64 --stacktrace
      - name: Profile generator APK
        run: ./gradlew :benchmark:assembleProfile -PminibrowserAbi=x86_64 --stacktrace

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation and profile generation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot -no-metrics
          script: |
            ./gradlew :app:connectedDebugAndroidTest -PminibrowserAbi=x86_64 --stacktrace
            ./gradlew :benchmark:connectedProfileAndroidTest \
              -PminibrowserAbi=x86_64 \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
              --stacktrace
      - name: Upload generated profile rules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-profile-rules
          if-no-files-found: warn
          path: |
            benchmark/build/outputs/**/*-baseline-prof.txt
            benchmark/build/outputs/**/*-startup-prof.txt
