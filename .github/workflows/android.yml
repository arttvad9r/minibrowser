name: Android

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify packaged baseline profile
        run: |
          if [ ! -f app/src/main/baselineProfiles/baseline-prof.txt ]; then
            echo "No committed Baseline Profile yet"
            exit 0
          fi
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -q 'assets/dexopt/baseline.prof'
          unzip -l "$apk" | grep -q 'assets/dexopt/baseline.profm'
          profile_bytes="$(unzip -p "$apk" assets/dexopt/baseline.prof | wc -c)"
          test "$profile_bytes" -gt 0
          test "$profile_bytes" -lt 1572864
          echo "Packaged baseline.prof: $profile_bytes bytes"
      - name: Performance benchmark APK
        run: ./gradlew :benchmark:assembleBenchmark -PminibrowserAbi=x86_64 --stacktrace
      - name: Profile generator APK
        run: ./gradlew :benchmark:assembleProfile -PminibrowserAbi=x86_64 --stacktrace

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation and profile generation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot -no-metrics
          script: |
            ./gradlew :app:connectedDebugAndroidTest -PminibrowserAbi=x86_64 --stacktrace
            # connectedAndroidTest may uninstall the debug target when it finishes. Clear data when
            # the package is still present; otherwise the profile variant will be installed fresh.
            adb shell pm clear com.artt.minibrowser || true
            # Regression tests use zero animation scales, but profile collection should exercise
            # the real Compose/Material motion paths that run on user devices.
            adb shell settings put global window_animation_scale 1.0
            adb shell settings put global transition_animation_scale 1.0
            adb shell settings put global animator_duration_scale 1.0
            ./gradlew :benchmark:connectedProfileAndroidTest -PminibrowserAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile --stacktrace
      - name: Upload generated profile rules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-profile-rules
          if-no-files-found: warn
          path: |
            benchmark/build/outputs/**/*-baseline-prof.txt
            benchmark/build/outputs/**/*-startup-prof.txt
      - name: Commit generated profile rules
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ ! -f .github/profile-autocommit.pending ]; then
            echo "Profile import sentinel is absent; nothing to commit"
            exit 0
          fi
          core="$(find benchmark/build/outputs -type f -name 'core-browser-baseline-prof.txt' -print -quit)"
          startup="$(find benchmark/build/outputs -type f -name 'startup-startup-prof.txt' -print -quit)"
          test -n "$core"
          test -n "$startup"
          git fetch origin "$HEAD_REF"
          git switch -C "$HEAD_REF" "origin/$HEAD_REF"
          python3 scripts/merge-profile-rules.py "$core" "$startup" app/src/main/baselineProfiles
          rm .github/profile-autocommit.pending
          git add app/src/main/baselineProfiles .github/profile-autocommit.pending
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Package generated baseline profiles"
          git push origin HEAD:"$HEAD_REF"
