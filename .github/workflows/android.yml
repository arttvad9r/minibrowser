name: Android

on:
  push:
  pull_request:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and emulator
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create emulator
        run: echo no | avdmanager create avd --force --name ci --package "system-images;android-35;google_apis;x86_64"
      - name: Start emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" @ci \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/emulator.log
          exit 1
      - name: Instrumentation tests
        run: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Emulator log on failure
        if: failure()
        run: cat /tmp/emulator.log || true
