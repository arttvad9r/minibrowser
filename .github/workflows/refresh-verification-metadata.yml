name: Refresh Dependency Verification Metadata

on:
  push:
    branches: [audit-fixes-2026-09-07]

permissions:
  contents: read

concurrency:
  group: refresh-verification-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Compile debug and refresh SHA-256 metadata
        run: ./gradlew --write-verification-metadata sha256 :app:compileDebugKotlin -PminibrowserAbi=arm64-v8a --stacktrace
      - name: Upload verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-metadata-refresh
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1
