name: Clean Gecko Engine Spike

on:
  pull_request:

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Restore Stage 1 verification metadata and remove cleanup workflow
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git checkout bc123613347d02cb6bca3440dfd218089e74897d -- gradle/verification-metadata.xml
          git rm .github/workflows/generate-engine-verification-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove failed Gecko engine spike metadata"
          git push origin "HEAD:${HEAD_REF}"
